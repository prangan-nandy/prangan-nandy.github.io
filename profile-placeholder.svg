<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 900" role="img" aria-labelledby="title desc">
  <title id="title">Prangan Nandy portrait placeholder</title>
  <desc id="desc">A stylized blue and violet portrait placeholder with the initials PN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.52" stop-color="#102d4d"/>
      <stop offset="1" stop-color="#251d54"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="52%">
      <stop offset="0" stop-color="#b9eaff" stop-opacity="0.72"/>
      <stop offset="0.22" stop-color="#65ddff" stop-opacity="0.30"/>
      <stop offset="0.58" stop-color="#8b5cf6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#07111f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9ecff"/>
      <stop offset="1" stop-color="#9c7aff"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>
  </defs>
  <rect width="720" height="900" fill="url(#bg)"/>
  <rect width="720" height="900" fill="url(#glow)"/>
  <g fill="none" stroke="#65ddff" stroke-opacity="0.20">
    <circle cx="360" cy="328" r="238"/>
    <circle cx="360" cy="328" r="290" stroke-dasharray="8 14"/>
    <ellipse cx="360" cy="328" rx="285" ry="112" transform="rotate(-18 360 328)"/>
    <ellipse cx="360" cy="328" rx="144" ry="286" transform="rotate(26 360 328)"/>
  </g>
  <circle cx="360" cy="312" r="142" fill="#65ddff" fill-opacity="0.12" filter="url(#blur)"/>
  <g fill="url(#figure)" opacity="0.88">
    <circle cx="360" cy="305" r="105"/>
    <path d="M155 760c18-159 96-252 205-252s187 93 205 252H155Z"/>
  </g>
  <g fill="#07111f" fill-opacity="0.74">
    <circle cx="360" cy="305" r="83"/>
    <path d="M193 760c19-127 81-205 167-205s148 78 167 205H193Z"/>
  </g>
  <text x="360" y="814" fill="#f6f9ff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="8" text-anchor="middle">PN</text>
  <text x="360" y="852" fill="#a9b7ca" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4" text-anchor="middle">ADD PROFILE PHOTO</text>
</svg>
